version: '3'

services:
  web:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - 8000
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    command: sh -c "python manage.py migrate --noinput && gunicorn doccure.wsgi:application --bind 0.0.0.0:8000"

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - 6379

  nginx:
    restart: always
    build: ./deployment/nginx/
    ports:
      - "8004:80"
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
