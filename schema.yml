components:
  schemas:
    Appointment:
      type: object
      properties:
        appointment_id:
          type: integer
        doctor:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        time:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - appointment_id
      - date
      - doctor
      - time
    BasicUserInformation:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
      required:
      - first_name
      - last_name
    BookingResponse:
      type: object
      properties:
        appointment_id:
          type: integer
          readOnly: true
        token:
          type: string
          readOnly: true
        doctor:
          type: string
          readOnly: true
        patient:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        time:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - appointment_id
      - date
      - doctor
      - patient
      - time
      - token
    Department:
      type: object
      properties:
        department:
          type: string
        doctor_count:
          type: string
          readOnly: true
        doctors:
          type: string
          readOnly: true
      required:
      - department
      - doctor_count
      - doctors
    Doctor:
      type: object
      properties:
        doctor_id:
          type: integer
        name:
          type: string
          readOnly: true
        specialization:
          type: string
          readOnly: true
        next_available:
          type: string
          readOnly: true
      required:
      - doctor_id
      - name
      - next_available
      - specialization
    Education:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        college:
          type: string
          maxLength: 300
        degree:
          type: string
          maxLength: 100
        year_of_completion:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
      required:
      - college
      - degree
      - id
    Experience:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        institution:
          type: string
          maxLength: 300
        from_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        to_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        designation:
          type: string
          nullable: true
          maxLength: 200
      required:
      - id
      - institution
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PatchedBasicUserInformation:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
    PatchedEducation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        college:
          type: string
          maxLength: 300
        degree:
          type: string
          maxLength: 100
        year_of_completion:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
    PatchedExperience:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        institution:
          type: string
          maxLength: 300
        from_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        to_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        designation:
          type: string
          nullable: true
          maxLength: 200
    PatchedRegistrationNumber:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        registration_number:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
    PatchedSpecialization:
      type: object
      properties:
        specialization:
          type: string
    Patient:
      type: object
      properties:
        patient_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          default: other
        age:
          type: string
          readOnly: true
      required:
      - age
      - name
      - patient_id
    RegistrationNumber:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        registration_number:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
      required:
      - id
    Specialization:
      type: object
      properties:
        specialization:
          type: string
    StatusEnum:
      enum:
      - pending
      - confirmed
      - completed
      - cancelled
      - no_show
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `no_show` - No Show
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: http
      scheme: bearer
