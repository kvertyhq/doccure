              $ref: '#/components/schemas/BasicUserInformation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BasicUserInformation'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicUserInformation'
          description: ''
    patch:
      operationId: accounts_update_basic_information_partial_update
