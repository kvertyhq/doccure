openapi: 3.0.3
info:
  title: Doccure API
  version: 1.0.0
  description: API documentation for the Doccure healthcare platform.
paths:
  /accounts/update-basic-information/:
    put:
      operationId: accounts_update_basic_information_update
      description: Verify that the current user is authenticated.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicUserInformation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BasicUserInformation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BasicUserInformation'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicUserInformation'
          description: ''
    patch:
      operationId: accounts_update_basic_information_partial_update
      description: Verify that the current user is authenticated.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBasicUserInformation'
          application/x-www-form-urlencoded:
