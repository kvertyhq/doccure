  version: 1.0.0
  description: API documentation for the Doccure healthcare platform.
paths:
  /accounts/update-basic-information/:
    put:
      operationId: accounts_update_basic_information_update
      description: Verify that the current user is authenticated.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicUserInformation'
          application/x-www-form-urlencoded:
