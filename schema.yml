              $ref: '#/components/schemas/PatchedBasicUserInformation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBasicUserInformation'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicUserInformation'
          description: ''
