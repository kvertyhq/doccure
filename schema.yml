components:
  schemas:
    BasicUserInformation:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
      required:
      - first_name
      - last_name
    Education:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        college:
          type: string
          maxLength: 300
        degree:
          type: string
          maxLength: 100
        year_of_completion:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
      required:
      - college
      - degree
      - id
    Experience:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        institution:
          type: string
          maxLength: 300
        from_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        to_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        designation:
          type: string
          nullable: true
          maxLength: 200
      required:
      - id
      - institution
    PatchedBasicUserInformation:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
    PatchedEducation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        college:
          type: string
          maxLength: 300
        degree:
          type: string
          maxLength: 100
        year_of_completion:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
    PatchedExperience:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        institution:
          type: string
          maxLength: 300
        from_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        to_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        designation:
          type: string
          nullable: true
          maxLength: 200
    PatchedRegistrationNumber:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        registration_number:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
    PatchedSpecialization:
      type: object
      properties:
        specialization:
          type: string
    RegistrationNumber:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        registration_number:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
      required:
      - id
    Specialization:
      type: object
      properties:
        specialization:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
